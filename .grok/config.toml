# Project-scoped Grok Build configuration for this Operator OS repository.
#
# This is the Grok counterpart of `.claude/settings.json` and `.codex/config.toml`.
# All three host layers are hand-maintained. Only the markdown discovery surfaces
# under `.agents/skills/`, `AGENTS.md`, `GEMINI.md` and
# `.github/copilot-instructions.md` are generated by `scripts/sync-agent-adapters`.
#
# Project `.grok/config.toml` may set MCP servers, plugins, and permission rules.
# Other keys (sandbox, compat, ui, permission_mode) load only from
# `~/.grok/config.toml`. Do not put credentials here.
#
# Folder trust makes this file, `.grok/hooks/` and `.grok/agents/` live. Grant it
# once with `/hooks-trust` or `grok --trust`. Setup: `.grok/README.md`.
#
# Interactive Grok (TUI and Desktop) keeps its default ask mode. The repo's own
# PreToolUse guards are the hard deny layer, same scripts Claude Code and Codex
# wire. Do not copy a Codex always-approve setting here; that is a Codex-sandbox
# choice, not a Grok requirement.

[permission]
deny = [
  "Read(./.env)",
  "Read(./.env.*)",
  "Edit(./.env)",
  "Edit(./.env.*)",
]
