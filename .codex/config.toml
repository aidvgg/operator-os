# Project-scoped Codex configuration for this Operator OS repository.
#
# This is the Codex counterpart of `.claude/settings.json`. Both are hand-maintained; only the
# markdown discovery surfaces under `.agents/skills/`, `AGENTS.md`, `GEMINI.md` and
# `.github/copilot-instructions.md` are generated by `scripts/sync-agent-adapters`.
#
# Codex loads this layer ONLY when the project is trusted. One-time setup on a new machine or a
# fresh clone is documented in `.codex/README.md`; without it, this file, `.codex/hooks.json` and
# `.codex/agents/` are all silently ignored and the repo runs without its guards.
#
# Project layers cannot override credential, provider, notification or telemetry keys. Anything of
# that kind belongs in `~/.codex/config.toml`, not here.

# Safer default than a full-access grant: the sandbox may write inside the workspace and Codex
# asks before anything outside it. Operators who trust this repo's own guard hooks and git hooks
# as the safety layer may loosen this to `sandbox_mode = "danger-full-access"` and
# `approval_policy = "never"`, which is a machine-wide sandbox boundary, not a repo-only grant.
# Either way, project trust makes this file live and hook trust is a SEPARATE gate: arm
# `.codex/hooks.json` interactively before relying on deny-env-access.py or
# deny-destructive-git.py. Until then, no project hook guard runs under Codex.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[agents]
# Custom agents live in .codex/agents/*.toml, ported from .claude/agents/*.md. They are the
# fresh-context verifiers that proposal-creator, invoice-creator and the hard-task protocol
# treat as mandatory, so they are not optional tooling here. Supporting workers default to
# medium; fact-check, price-attack and client-sim each pin their mandatory high effort locally.
max_concurrent_threads_per_session = 6
default_subagent_reasoning_effort = "medium"
