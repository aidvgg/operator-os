name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run git guard fixtures
        run: ./scripts/test-git-guard

      - name: Run repo-doctor
        run: ./scripts/repo-doctor

      - name: Check generated agent adapters are current
        run: ./scripts/sync-agent-adapters --check

      - name: Run research-doctrine absence-record fixtures
        run: ./scripts/test-research-doctrine-absence

      - name: Run repo-doctor tombstone prefilter fixtures
        run: ./scripts/test-doctor-tombstone-prefilter

      - name: Run repo-doctor secret-prefix fixtures
        run: ./scripts/test-doctor-secret-prefix

      - name: Run repo-doctor start-cache fixtures
        run: ./scripts/test-doctor-start-cache

      - name: Run read-context fixtures
        run: ./scripts/test-read-context

      - name: Run ledger-index fixtures
        run: ./scripts/test-ledger-index

      - name: Run artifact receipt fixtures
        run: ./scripts/test-artifact-receipt

      - name: Run extract-pdf-text fixtures
        run: ./scripts/test-extract-pdf-text

      - name: Run transcribe-media fixtures
        run: ./scripts/test-transcribe-media

      - name: Run scan-transcript-loops fixtures
        run: ./scripts/test-scan-transcript-loops

      - name: Run invoice arithmetic fixtures
        run: bash scripts/test-invoice-arithmetic

      - name: Run remote host pipeline fixtures
        run: ./scripts/test-agent-mutate

      - name: Run run-coding-session script tests
        run: python3 -m unittest discover -s skills/run-coding-session/scripts -p 'test_*.py'

      - name: Compile extensionless Python scripts
        run: |
          find scripts -maxdepth 1 -type f ! -name "*.*" -print0 \
            | xargs -0 -I{} sh -c 'if file "{}" | grep -qi python; then python3 -m py_compile "{}"; fi'
          find .claude/hooks -maxdepth 1 -type f -name "*.py" -print0 \
            | xargs -0 python3 -m py_compile

      - name: Check skill scripts with node
        run: |
          find skills -path "*/scripts/*.js" -print0 \
            | xargs -0 -I{} node --check "{}"
